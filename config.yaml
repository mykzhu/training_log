name: "Training Log"
version: "1.5.0"
slug: "training_log"
description: "Personal workout logger for Home Assistant"
url: "https://github.com/mykzhu/training_log"

arch:
  - aarch64
  - amd64

startup: application
boot: auto
init: false

ingress: true
ingress_port: 8000
ingress_entry: /
panel_title: "Training Log"
panel_icon: "mdi:dumbbell"
panel_admin: false

ports:
  8000/tcp: 8000

ports_description:
  8000/tcp: "Training Log web interface"

webui: "http://[HOST]:[PORT:8000]/"

environment:
  DB_PATH: "/data/training.db"
  PORT: "8000"

options: {}
schema: {}
